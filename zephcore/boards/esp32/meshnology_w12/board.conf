# Meshnology W12 "WiFi LoRa 32 V5" — ESP32-S3R8 + LR2021 + GC1109 FEM
#
# Hardware (schematic W12-MB-V0.2, archived in devdocs/w12/vendor/):
# - ESP32-S3R8 (WROOM-1 N16R8): 16 MB QIO flash, 8 MB OPI PSRAM
# - LR2021 on SPI2 (GPIO8 NSS, 9 SCK, 10 MOSI, 11 MISO, 12 RST, 13 BUSY),
#   IRQ on GPIO14 = chip DIO8, plain crystal (no TCXO)
# - GC1109 sub-GHz PA/LNA on chip DIO9/10/11, rail enable GPIO4 (active HIGH)
# - RFX2402E 2.4 GHz PA on chip DIO5/6, rail enable GPIO3 (held LOW, unused)
# - SSD1315 128x64 bicolour OLED @ 0x3C on I2C0 (SDA 17, SCL 18, RST 47)
# - Battery ADC GPIO1 = ADC1_CH0, divider enable GPIO2 (active HIGH), ratio 4.90
# - Vext GPIO45 active LOW; user button GPIO0; RGB LED GPIO46 (unused, see below)
# - GNSS header on UART1 (unpopulated from the factory)
#
# Include order: prj.conf → zephcore_common.conf → esp32_common.conf → board.conf

CONFIG_ZEPHCORE_BOARD_NAME="Meshnology W12"
CONFIG_BT_DIS_MODEL_NUMBER_STR="Meshnology W12 LR2021"

CONFIG_ZEPHCORE_RADIO_LR2021=y

# Flash — 16 MB (override the 4 MB esp32_common.conf default)
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y

# 8 MB OPI PSRAM. Enable is auto-detected from DTS by Kconfig.psram; only the
# mode is set here, same as station_g2 / thinknode_m9 / xiao_esp32s3.
CONFIG_SPIRAM_MODE_OCT=y

# ========== TX power: the number here is CHIP output, not antenna output ==========
#
# The GC1109 sits between the LR2021 and the antenna. These values come from a
# measured sweep on real hardware (tinySA, MeshCore PR #3319), which replaced an
# earlier reading taken from upstream's variant comment -- that comment claimed
# the part's absolute maximum TX-port input was +5 dBm with full saturation
# around 3-4 dBm, and the sweep contradicts both halves: the board was driven
# across the full 0..22 dBm range without damage, and output keeps climbing to
# 13 dBm before it flattens.
#
#   chip dBm |  4     5     9    12    13    16    22
#   measured | 20.6  19.1  25.1  26.6  27.1  27.1  27.1
#
# So 13 dBm is the saturation knee and the useful ceiling; above it the extra
# drive turns into distortion and heat, not range. The old 4 dBm cap left the
# board about 6.5 dB down on what it can do.
#
# Note the vendor's 30 +/- 1 dBm conducted rating is not reached at any setting
# in that sweep -- a tinySA is +/-1-2 dB on absolute level, so the true ceiling
# is plausibly ~28-29 dBm, but it is not 30 dBm at 4 dBm of drive.
#
# The default is deliberately below the cap (unlike the old same-value pair, and
# like Station G2's 15/19): 5 dBm is roughly 19-22 dBm at the antenna, a sane
# out-of-the-box level, with the rest available to anyone who wants it. The knob
# still spans -9 dBm downward for regional ERP limits -- but note this is a 1 W
# class node and even the minimum is above the EU 868 14 dBm ERP limit.
CONFIG_ZEPHCORE_DEFAULT_TX_POWER_DBM=5
CONFIG_ZEPHCORE_MAX_TX_POWER_DBM=13
