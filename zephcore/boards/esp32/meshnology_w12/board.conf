# Meshnology W12 "WiFi LoRa 32 V5" — ESP32-S3R8 + LR2021 + GC1109 FEM
#
# Hardware (schematic W12-MB-V0.2, archived in devdocs/w12/vendor/):
# - ESP32-S3R8 (WROOM-1 N16R8): 16 MB QIO flash, 8 MB OPI PSRAM
# - LR2021 on SPI2 (GPIO8 NSS, 9 SCK, 10 MOSI, 11 MISO, 12 RST, 13 BUSY),
#   IRQ on GPIO14 = chip DIO8, plain crystal (no TCXO)
# - GC1109 sub-GHz PA/LNA on chip DIO9/10/11, rail enable GPIO4 (active HIGH)
# - RFX2402E 2.4 GHz PA on chip DIO5/6, rail enable GPIO3 (held LOW, unused)
# - SSD1315 128x64 bicolour OLED @ 0x3C on I2C0 (SDA 17, SCL 18, RST 47)
# - Battery ADC GPIO1 = ADC1_CH0, divider enable GPIO2 (active HIGH), ratio 4.90
# - Vext GPIO45 active LOW; user button GPIO0; RGB LED GPIO46 (unused, see below)
# - GNSS header on UART1 (unpopulated from the factory)
#
# Include order: prj.conf → zephcore_common.conf → esp32_common.conf → board.conf

CONFIG_ZEPHCORE_BOARD_NAME="Meshnology W12"
CONFIG_BT_DIS_MODEL_NUMBER_STR="Meshnology W12 LR2021"

CONFIG_ZEPHCORE_RADIO_LR2021=y

# Flash — 16 MB (override the 4 MB esp32_common.conf default)
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y

# 8 MB OPI PSRAM. Enable is auto-detected from DTS by Kconfig.psram; only the
# mode is set here, same as station_g2 / thinknode_m9 / xiao_esp32s3.
CONFIG_SPIRAM_MODE_OCT=y

# ========== TX power: the number here is CHIP output, not antenna output ==========
#
# The GC1109 sits between the LR2021 and the antenna and adds roughly 26 dB.
# The vendor rates the finished board at 30 +/- 1 dBm conducted, and MeshCore's
# variant notes the part's absolute maximum TX-port input is +5 dBm with full
# saturation already reached around 3-4 dBm. So 4 dBm at the chip is both the
# most that is useful and the most that is safe: beyond it the extra drive turns
# into distortion and heat, not range.
#
# Cap and default are deliberately the same value. Unlike Station G2 (default 15,
# cap 19) there is no useful headroom above saturation to leave a user, and the
# knob still spans -9..4 downward — roughly 17..30 dBm at the antenna — which is
# the range that matters for staying inside a regional ERP limit. Anyone setting
# this for EU 868 should note that even -9 dBm at the chip is well above 14 dBm
# ERP once the FEM has had its way.
CONFIG_ZEPHCORE_DEFAULT_TX_POWER_DBM=4
CONFIG_ZEPHCORE_MAX_TX_POWER_DBM=4
