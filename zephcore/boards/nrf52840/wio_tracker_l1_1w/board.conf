# Wio Tracker L1 Pro 1W (nRF52840 + SX1262 + 1 W external PA)
# Board-specific configuration - pins and unique features only
#
# Hardware:
# - SX1262 LoRa on SPI2 (P1.14 CS, P1.07 RST, P1.10 BUSY, P0.07 DIO1)
#   NO external RXEN on this board - DIO2 drives the whole antenna switch
# - 1 W PA behind an LDO on P0.14 (LORA_PWR_EN), held on by a devicetree
#   regulator; see the DTS for why it is never switched off
# - L76KB GPS on UART0 (P0.26/P0.27)
# - P25Q16H 2MB QSPI flash
# - Battery ADC on AIN7 (P0.31), enable on P0.04
# - SH1106 OLED on I2C0 (P0.05/P0.06, addr 0x3D)
# - Grove I2C1 on P1.11/P1.12, 5 V boost on P0.13 (parked off)
# - Joystick + user button + buzzer (P1.00)

# Board identification
CONFIG_ZEPHCORE_BOARD_NAME="Wio Tracker L1 Pro 1W"

# Device Information Service model name
CONFIG_BT_DIS_MODEL_NUMBER_STR="Wio Tracker L1 Pro 1W"

# SoftDevice firmware ID (s140 v7.3.0 - Seeed bootloader, same as the stock L1)
CONFIG_ZEPHCORE_SD_FWID=0x0123

# TX power is left at the 22 dBm default, i.e. the full chip output into the
# PA. Both upstreams do the same on this board and neither states a PA input
# spec: MeshCore's env sets LORA_TX_POWER=22, Meshtastic sets
# SX126X_MAX_POWER 22 (plus SX126X_NO_POWER_OPTIMIZATION_TABLE, which only
# turns off RadioLib's own current-limit table and has no ZephCore analogue).
# UNVERIFIED on hardware. If a datasheet or a measurement later shows the PA
# saturates below 22 - the shape the W12 measurement found, see
# memory/meshnology-w12-port.md - set CONFIG_ZEPHCORE_DEFAULT_TX_POWER_DBM
# and CONFIG_ZEPHCORE_MAX_TX_POWER_DBM here rather than leaving the knob at
# the ceiling.
