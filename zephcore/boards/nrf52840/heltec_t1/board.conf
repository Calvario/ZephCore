# Heltec Mesh Node T1 - nRF52840 + SX1262 + UC6580 GNSS
# Board-specific configuration
#
# Hardware (Heltec Mesh_Node_T1_V1.0 schematic + datasheet Rev 1.0.0):
# - nRF52840 SoC, SX1262 LoRa, no FEM (uPG2179 SPDT switch driven by DIO2)
# - UC6580 GNSS on UART0 at 115200 baud (L1+L5, ATR2652 LNA front end)
# - ST7735S 0.96" 160x80 TFT (SPI3, MIPI-DBI, mono-tft wrapper)
# - PAM8904 piezo buzzer driver, tone input on PWM0/P0.09
# - Battery ADC on AIN3 (P0.05), 390K/100K divider, enable P0.11
# - LED: P0.16 (active-LOW)
# - Buttons: P1.10 (user, active-LOW) and P0.14 (function, active-LOW)
# - ICM-42607-P + MMC5983MA on a gated I2C bus; no ZephCore consumer, so the
#   bus and its rail are left off
# - No external flash: storage is internal /lfs only
#
# Not set here because devicetree already decides them:
# - CONFIG_PWM / CONFIG_ZEPHCORE_UI_BUZZER come from the "buzzer" nodelabel
# - CONFIG_ZEPHCORE_UI_DISPLAY comes from chosen { zephyr,display }
# - CONFIG_ZEPHCORE_DEFAULT_TX_POWER_DBM stays at the 22 dBm default: there is
#   no PA to overdrive, and datasheet table 3.3 rates the board at 21 +/- 1 dBm
#   in both the 863-870 and 902-928 MHz bands.

# Board identification. "Heltec Mesh Node T1" is the exact device name the
# MeshCore flasher catalogue uses, so the Mesh America configurator folds this
# into the existing device tile instead of creating a ZephCore-only one.
CONFIG_ZEPHCORE_BOARD_NAME="Heltec Mesh Node T1"

# Device Information Service model name
CONFIG_BT_DIS_MODEL_NUMBER_STR="Heltec Mesh Node T1"

# SoftDevice firmware ID (s140 v6.1.1)
CONFIG_ZEPHCORE_SD_FWID=0x00B6

# ========== RAM budget ==========
# CFB mono-tft framebuffer = 160x80/8 = 1600 bytes, allocated from k_malloc.
# Default heap (2048) is sized tightly for SSD1306 128x64 (1024 bytes).
CONFIG_HEAP_MEM_POOL_SIZE=4096
